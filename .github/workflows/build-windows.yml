name: Build Windows CLI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      model_tier:
        description: "PP-OCRv6 model tier to bundle (tiny/small/medium)"
        required: false
        default: "small"
      bundle_checkbox_model:
        description: "Also bundle the checkbox detection model (+10.8 MB, AGPL-3.0)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Intel's official NuGet package ships a prebuilt ONNX Runtime with the
  # OpenVINO execution provider actually compiled in (plus the OpenVINO
  # runtime DLLs it depends on, bundled inside the package) - the same
  # binaries the `onnxruntime-openvino` Python wheel installs under the
  # hood, just distributed via NuGet instead of PyPI. It also ships the
  # plain CPU execution provider, so it replaces the separate CPU-only
  # ONNX Runtime download entirely: one dependency, both --engine values
  # actually work.
  ORT_OPENVINO_PACKAGE: "intel.ml.onnxruntime.openvino"
  ORT_OPENVINO_VERSION: "1.24.1"
  MODEL_TIER: ${{ github.event.inputs.model_tier || 'small' }}
  # Opt-in: the checkbox model is AGPL-3.0 and ~10.8 MB, and --detect-checkboxes
  # is off by default, so plain pushes ship without it.
  BUNDLE_CHECKBOX: ${{ github.event.inputs.bundle_checkbox_model || 'false' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          # Only cache the built package tree, not buildtrees/downloads:
          # those intermediate artifacts are several GB for an OpenCV build
          # and were pushing the cache past GitHub's per-repo size cap,
          # causing eviction and a full rebuild on every run.
          path: C:/vcpkg/installed
          key: vcpkg-opencv-x64-windows-${{ runner.os }}-v2

      - name: Install OpenCV via vcpkg
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install opencv4:x64-windows

      - name: Download ONNX Runtime (OpenVINO EP, Intel NuGet package)
        shell: pwsh
        run: |
          $pkgId = $env:ORT_OPENVINO_PACKAGE
          $ver = $env:ORT_OPENVINO_VERSION
          $url = "https://api.nuget.org/v3-flatcontainer/$pkgId/$ver/$pkgId.$ver.nupkg"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ort_openvino.nupkg

          # A .nupkg is a plain zip; Expand-Archive wants a .zip extension.
          Copy-Item ort_openvino.nupkg ort_openvino.zip
          Expand-Archive -Path ort_openvino.zip -DestinationPath ort_openvino_extract

          New-Item -ItemType Directory -Force -Path third_party/onnxruntime/include | Out-Null
          New-Item -ItemType Directory -Force -Path third_party/onnxruntime/lib | Out-Null

          # Flatten whatever the package's actual header layout is
          # (NuGet native packages typically use build/native/include/).
          Get-ChildItem -Path ort_openvino_extract -Recurse -Filter "*.h" |
            Copy-Item -Destination third_party/onnxruntime/include -Force

          # Same for the win-x64 native binaries: onnxruntime.dll/.lib,
          # the OpenVINO EP plugin, and the OpenVINO runtime DLLs +
          # plugins.xml it needs, all bundled in runtimes/win-x64/native/.
          Get-ChildItem -Path ort_openvino_extract -Recurse -Include "*.dll", "*.lib", "*.xml" |
            Where-Object { $_.FullName -match "[/\\]win-x64[/\\]" -or $_.FullName -match "[/\\]runtimes[/\\]" } |
            Copy-Item -Destination third_party/onnxruntime/lib -Force

          Write-Host "Headers:"; Get-ChildItem third_party/onnxruntime/include | Select-Object Name
          Write-Host "Native libs:"; Get-ChildItem third_party/onnxruntime/lib | Select-Object Name

      - name: Download PP-OCRv6 models
        shell: pwsh
        run: |
          if ($env:BUNDLE_CHECKBOX -eq "true") {
            powershell -ExecutionPolicy Bypass -File models/download_models.ps1 -Tier $env:MODEL_TIER -Checkbox
          } else {
            powershell -ExecutionPolicy Bypass -File models/download_models.ps1 -Tier $env:MODEL_TIER
          }

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DONNXRUNTIME_ROOTDIR="${{ github.workspace }}/third_party/onnxruntime"

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release -j

      - name: Stage package
        shell: pwsh
        run: |
          $pkg = "dist/paddlevino"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item build/Release/paddlevino.exe $pkg/
          Copy-Item build/Release/*.dll $pkg/ -ErrorAction SilentlyContinue
          Copy-Item build/Release/*.xml $pkg/ -ErrorAction SilentlyContinue
          Copy-Item C:/vcpkg/installed/x64-windows/bin/*.dll $pkg/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pkg/models" | Out-Null
          Copy-Item models/det.onnx, models/rec.onnx, models/cls.onnx "$pkg/models/" -ErrorAction SilentlyContinue
          Copy-Item models/ppocrv6_dict.txt "$pkg/models/" -ErrorAction SilentlyContinue
          # Staged only when the workflow was dispatched with
          # bundle_checkbox_model, so the default zip stays free of the
          # AGPL-3.0 model and its 10.8 MB.
          if ($env:BUNDLE_CHECKBOX -eq "true") {
            Copy-Item models/checkbox.onnx "$pkg/models/"
          }
          Copy-Item README.md $pkg/ -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md $pkg/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE $pkg/ -ErrorAction SilentlyContinue
          Copy-Item THIRD_PARTY_LICENSES $pkg/ -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/paddlevino-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddlevino-windows-x64
          path: dist/paddlevino-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/paddlevino-windows-x64.zip
          generate_release_notes: true
